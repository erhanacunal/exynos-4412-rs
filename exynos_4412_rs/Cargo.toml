[package]
name = "exynos_4412_rs"
version = "0.1.0"
edition = "2024"
description = "Bare-metal runtime and drivers for the Samsung Exynos 4412, started from U-Boot"
license = "MIT"

[features]
default = ["panic-handler"]
# Print file:line and the message on the console, then halt.
panic-handler = []

[dependencies]
smoltcp = { version = "0.14", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-dhcpv4", "socket-icmp", "auto-icmp-echo-reply"] }
tock-registers = { version = "0.10.1", default-features = false, features = ["register_types"] }
